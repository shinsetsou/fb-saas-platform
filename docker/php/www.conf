; Override the bundled www.conf to listen on a TCP port (the bundled conf
; listens on a Unix socket at /run/php-fpm.sock, which is awkward for
; cross-container networking on Windows hosts). The webserver connects on
; app:9000.

[www]
listen = 0.0.0.0:9000
listen.owner = app
listen.group = app
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 200

clear_env = no

catch_workers_output = yes
decorate_workers_output = no
