; Project PHP overrides — these run after the bundled conf.d and override it.
; Keep this file's name prefixed with "zz-" so it loads last.

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60

expose_php = Off
display_errors = Off
log_errors = On

date.timezone = UTC
